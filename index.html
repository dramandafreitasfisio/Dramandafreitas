<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AF Estética Avançada | Botox Premium</title>

<style>
:root {
    --gold: #dfc18d;
    --gold-dark: #aa8a52;
    --gold-light: #f4e4c1;
    --bg-dark: #0f0f11;
    --bg-card: #16161a;
    --white: #ffffff;
    --text: #eaeaea;
    --muted: #a19b91;
    --green: #25d366;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
    scroll-padding-top: 90px;
}

body {
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    background: var(--bg-dark);
    line-height: 1.7;
}

h1, h2, h3 {
    font-family: 'Playfair Display', serif;
    font-weight: 500;
    line-height: 1.2;
    color: var(--gold-light);
}

a {
    text-decoration: none;
    color: inherit;
}

button {
    font-family: inherit;
}

.container {
    width: min(1200px, 90%);
    margin: auto;
}

.section {
    padding: 100px 0;
}

.section-title {
    text-align: center;
    max-width: 680px;
    margin: 0 auto 45px;
}

.section-title h2 {
    font-size: clamp(2rem, 4vw, 3.1rem);
    margin: 12px 0 18px;
}

.section-title p {
    color: var(--muted);
}

.eyebrow {
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 3px;
    font-size: .75rem;
    font-weight: 700;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 15px 25px;
    border-radius: 3px;
    border: 1px solid var(--gold);
    background: var(--gold);
    color: #0f0f11;
    font-size: .88rem;
    font-weight: 700;
    letter-spacing: .3px;
    transition: .3s;
    cursor: pointer;
}

.btn:hover {
    background: var(--gold-dark);
    border-color: var(--gold-dark);
    color: var(--white);
    transform: translateY(-2px);
}

.btn-outline {
    background: transparent;
    color: var(--gold-light);
}

.btn-outline:hover {
    background: var(--gold);
    color: var(--bg-dark);
}

.topbar {
    background: var(--gold-dark);
    color: var(--bg-dark);
    text-align: center;
    padding: 9px 15px;
    font-size: .78rem;
    letter-spacing: .4px;
    font-weight: 600;
}

header {
    height: 82px;
    background: rgba(15, 15, 17, 0.95);
    display: flex;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
    border-bottom: 1px solid rgba(223, 193, 141, 0.2);
    backdrop-filter: blur(10px);
}

.nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
}

.logo {
    font-family: 'Playfair Display', serif;
    color: var(--gold-light);
    font-size: 1.55rem;
    line-height: 1.15;
}

.logo small {
    display: block;
    font-family: 'DM Sans', sans-serif;
    color: var(--muted);
    font-size: .62rem;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-top: 5px;
}

.nav-links {
    display: flex;
    gap: 28px;
    align-items: center;
    font-size: .84rem;
}

.nav-links a:not(.btn) {
    color: var(--text);
    transition: 0.3s;
}

.nav-links a:not(.btn):hover {
    color: var(--gold);
}

        url('https://unsplash.com')
        center 35% / cover no-repeat;
}

.hero-content {
    max-width: 590px;
    padding: 85px 0;
}

.hero-label {
    display: inline-block;
    border: 1px solid rgba(223, 193, 141, 0.3);
    color: var(--gold);
    padding: 7px 14px;
    font-size: .75rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 25px;
    background: rgba(22, 22, 26, 0.6);
}

.hero h1 {
    font-size: clamp(2.5rem, 5vw, 4.5rem);
    color: var(--white);
    margin-bottom: 22px;
    letter-spacing: -1px;
}

.hero h1 span {
    color: var(--gold);
    font-style: italic;
}

.hero p {
    max-width: 470px;
    color: var(--text);
    font-size: 1.02rem;
    margin-bottom: 30px;

    gap: 13px;

}

.hero-note {
    margin-top: 25px;
    font-size: .78rem;
    color: var(--muted);
}

.promo-text {

    font-size: 1.25rem;
    color: var(--gold-light);
}

.about-grid {

    grid-template-columns: 1fr 1fr;
    gap: 75px;
    align-items: center;
}

.about-image {
    min-height: 490px;
    position: relative;
    background:
        url('https://unsplash.com')
        center / cover no-repeat;
    border: 1px solid rgba(223, 193, 141, 0.2);
}

.image-caption {
    position: absolute;
    bottom: -20px;
    right: -20px;
    background: var(--bg-card);
    border: 1px solid rgba(223, 193, 141, 0.3);
    padding: 22px;
    max-width: 250px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.image-caption strong {
    display: block;
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    color: var(--gold);
}

.image-caption span {
    font-size: .78rem;
    color: var(--muted);
}

.about-text h2 {
    font-size: clamp(2.2rem, 4vw, 3.3rem);
    margin: 14px 0 23px;
}

.about-text p {
    color: var(--text);
    margin-bottom: 18px;
}

.check-list {
    list-style: none;
    margin: 25px 0 30px;

    margin-bottom: 12px;

    gap: 12px;
    font-size: .92rem;
}

.check-list li::before {
    content: '✓';
    color: var(--gold);
    font-weight: 700;
}

/* BENEFÍCIOS */
.benefits {
    background: var(--bg-card);
}

.benefit-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
}

.benefit-card {
    background: var(--bg-dark);
    padding: 35px 28px;
    border: 1px solid rgba(223, 193, 141, 0.1);
    transition: .3s;
}

.benefit-card:hover {
    transform: translateY(-5px);
    border-color: var(--gold);
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
}

.benefit-icon {
    font-size: 1.8rem;
    margin-bottom: 20px;
    color: var(--gold);
}

.benefit-card h3 {
    font-size: 1.35rem;
    margin-bottom: 13px;
}

.benefit-card p {
    font-size: .9rem;
    color: var(--muted);
}

    padding: 15px;
    border-radius: 4px;

    display: grid;

    gap: 10px;
}

.gallery-img-box {

}

.gallery-img-box img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    border-radius: 2px;
}

.img-label {
    position: absolute;
    bottom: 10px;
    left: 10px;
    background: rgba(15, 15, 17, 0.8);
    color: var(--gold-light);
    padding: 3px 8px;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    border: 1px solid rgba(223, 193, 141, 0.3);
}

.gallery-item h3 {
    font-size: 1.15rem;
    margin-top: 15px;
    text-align: center;
}

/* FAQ */
.faq-section {
    background: var(--bg-card);
}

.faq-container {
    max-width: 800px;
    margin: 0 auto;
}

.faq-item {
    display: block;
    margin-bottom: 15px;
    border-bottom: 1px solid rgba(223, 193, 141, 0.1);
}

details {
    padding: 15px 0;
    cursor: pointer;
}

summary {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;

    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 500;
}

summary::-webkit-details-marker {
    display: none;
}

summary::after {
    content: '+';
    font-size: 1.5rem;
    color: var(--gold);
    transition: 0.3s;
}

details[open] summary::after {

details p {
    margin-top: 15px;

    font-size: 0.95rem;
    line-height: 1.6;
}

footer {
    background: var(--bg-dark);
    padding: 60px 0 30px;
    border-top: 1px solid rgba(223, 193, 141, 0.1);
    font-size: 0.9rem;
    color: var(--muted);
}

.footer-grid {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;

    margin-bottom: 40px;
}

.footer-brand h3 {
    font-size: 1.4rem;
    margin-bottom: 15px;

.footer-links h4, .footer-contact h4 {
    color: var(--gold-light);

.footer-links ul {
    list-style: none;
}

.footer-links li {
    margin-bottom: 10px;

.footer-links a:hover {

}

.social-btn {
